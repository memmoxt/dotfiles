# See https://wiki.hyprland.org/Configuring/Window-Rules/
# type "hyprctl clients" to view all open applications and get the class: name

# '$&' is a hyde specific shorthand for "override" \\ analogous to a reference
# This symbol indicates that the following values will override the default configuration
$&=override
windowrule = opacity 1.0 override 1 override 1 override, match:class mpv
windowrule = opacity 1.0 override 0.9 override 1 override, match:class kitty
windowrule = opacity 1.0 override 0.9 override 1 override, match:class org.qutebrowser.qutebrowser
windowrule = opacity 1.0 override 1 override 1 override, match:class chromium
windowrule = opacity 1.0 override 1 override 1 override, match:class org.inkscape.Inkscape
windowrule = opacity 1.0 override 1 override 1 override, match:class krita 
windowrule = opacity 1.0 override 0.9 override 1 override, match:class discord 
windowrule = opacity 1.0 override 0.9 override 1 override, match:class Redot 
windowrule = opacity 1.0 override 1 override 1 override, match:class blender
windowrule = opacity 1.0 override 1 override 1 override, match:class input-remapper-gtk
windowrule = opacity 1.0 override 1 override 1 override, match:class brave-origin-nightly
windowrule {
  name = kando
  match:class = ^(kando)$
  no_blur = on
  opaque = on
  size = 100% 100%
  border_size = 0
  no_anim = on
  float = on
  pin = on
}


