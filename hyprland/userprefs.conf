# Set your personal hyprland configuration here
# See https://wiki.hyprland.org/Configuring for more information

# Load on boot
exec-once = input-remapper-control --command autoload

# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░


input {
    kb_layout = us,us
    kb_variant = ,intl


    # enable F13-F24 keys
    kb_options = fkeys:basic_13-24
 }


#My monitor has 2560x1440 = 16:9
# Wacom Intuos Pro M (pth-660) has 224x148mm = 56:37
 input:tablet{
     output = DP-1
     left_handed = false
     active_area_size = 224 148 # 224x148mm = 56:37
     region_size = 2560 1692 # 2560x1692 = 56:37
     # active_area_size = 224 126 # 224x126mm = 16:9
     relative_input = false 
}

misc {
        enable_anr_dialog = false
    }


